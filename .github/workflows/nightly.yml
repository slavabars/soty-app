name: Nightly

# Full suite every night so a flaky test or a dependency drift is noticed
# without waiting for the next pull request. 02:00 UTC = 05:00 MSK.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  test:
    name: full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.3"
          channel: stable
          cache: true

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Tests
        run: flutter test --no-pub --reporter expanded

  build:
    name: debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOTY_SIGNING: debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.3"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --flavor site --target lib/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: soty-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7
